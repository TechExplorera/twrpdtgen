name: Generate TWRP device tree

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'Direct download link to recovery.img / boot.img (raw, .lz4, .zip or .tar/.tar.md5)'
        required: true
      super_size:
        description: 'Super partition size in bytes (optional, adb shell blockdev --getsize64 /dev/block/by-name/super)'
        required: false
        default: ''
      build_twrp:
        description: 'Also build TWRP with the generated tree (takes 1-2 hours)'
        type: boolean
        default: false
      twrp_branch:
        description: 'TWRP minimal manifest branch (only used when building)'
        type: choice
        default: 'twrp-12.1'
        options:
          - 'twrp-12.1'
          - 'twrp-14.1'

permissions:
  contents: write

jobs:
  generate:
    name: Generate device tree
    runs-on: ubuntu-latest
    outputs:
      manufacturer: ${{ steps.tree.outputs.manufacturer }}
      codename: ${{ steps.tree.outputs.codename }}
      build_target: ${{ steps.tree.outputs.build_target }}
      release_tag: ${{ steps.tree.outputs.release_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio lz4 unzip file xz-utils
          pip install .

      - name: Download image
        env:
          IMAGE_URL: ${{ inputs.image_url }}
        run: |
          if ! [[ "$IMAGE_URL" =~ ^https?:// ]]; then
            echo "::error::image_url must be an http(s) link, got: $IMAGE_URL"
            echo "The workflow runs on a GitHub server and can't read files from your computer."
            echo "Upload the image first and use the direct download link it gives you, e.g.:"
            echo "  curl -T recovery.img https://<your-uploader>/recovery.img"
            echo "or attach it to a release of this repository and use the asset link:"
            echo "  gh release create images --notes images recovery.img"
            echo "  -> https://github.com/<you>/twrpdtgen/releases/download/images/recovery.img"
            exit 1
          fi
          bash scripts/fetch_image.sh "$IMAGE_URL" input/recovery.img

      - name: Generate device tree
        env:
          SUPER_SIZE: ${{ inputs.super_size }}
        run: |
          ARGS=(input/recovery.img -o output --git)
          if [ -n "$SUPER_SIZE" ]; then
            if ! [[ "$SUPER_SIZE" =~ ^[0-9]+$ ]]; then
              echo "❌ super_size must be a number of bytes, got: $SUPER_SIZE"
              exit 1
            fi
            ARGS+=(--super-size "$SUPER_SIZE")
          fi
          python3 -m twrpdtgen "${ARGS[@]}"

      - name: Get tree info
        id: tree
        run: |
          TREE_DIR=$(find output -mindepth 2 -maxdepth 2 -type d | head -n 1)
          [ -n "$TREE_DIR" ] || { echo "❌ No device tree generated"; exit 1; }
          MANUFACTURER=$(basename "$(dirname "$TREE_DIR")")
          CODENAME=$(basename "$TREE_DIR")
          if grep -q '^BOARD_USES_RECOVERY_AS_BOOT := true' "$TREE_DIR/BoardConfig.mk"; then
            BUILD_TARGET=bootimage
          else
            BUILD_TARGET=recoveryimage
          fi
          echo "tree_dir=$TREE_DIR" >> "$GITHUB_OUTPUT"
          echo "manufacturer=$MANUFACTURER" >> "$GITHUB_OUTPUT"
          echo "codename=$CODENAME" >> "$GITHUB_OUTPUT"
          echo "build_target=$BUILD_TARGET" >> "$GITHUB_OUTPUT"
          echo "release_tag=${CODENAME}-$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

          # Archive keeping the device/<manufacturer>/<codename> layout
          mkdir -p dist/device
          cp -r "output/$MANUFACTURER" dist/device/
          tar -C dist -czf "twrp_device_${MANUFACTURER}_${CODENAME}.tar.gz" device

          {
            echo "## TWRP device tree: \`device/$MANUFACTURER/$CODENAME\`"
            echo
            echo "Build target: \`mka $BUILD_TARGET\`"
            echo
            echo '```'
            (cd "$TREE_DIR" && find . -path ./.git -prune -o -type f -print | sed 's|^\./||' | sort)
            echo '```'
            echo
            echo "<details><summary>BoardConfig.mk</summary>"
            echo
            echo '```makefile'
            cat "$TREE_DIR/BoardConfig.mk"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload device tree artifact
        uses: actions/upload-artifact@v5
        with:
          name: device-tree
          path: dist/device
          include-hidden-files: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tree.outputs.release_tag }}" \
            --title "Device tree: ${{ steps.tree.outputs.manufacturer }}/${{ steps.tree.outputs.codename }}" \
            --notes "Generated by twrpdtgen from the image provided to run ${{ github.run_id }}. Extract the archive in the root of your TWRP source tree." \
            "twrp_device_${{ steps.tree.outputs.manufacturer }}_${{ steps.tree.outputs.codename }}.tar.gz"

  build:
    name: Build TWRP
    needs: generate
    if: ${{ inputs.build_twrp }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # Not every package exists on every Ubuntu release, install what's available
          for pkg in bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs \
                     gnupg gperf imagemagick lib32z1-dev libelf-dev liblz4-tool lz4 libssl-dev \
                     libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc \
                     zip zlib1g-dev python3 python-is-python3 libncurses-dev; do
            sudo apt-get install -y "$pkg" >/dev/null 2>&1 || echo "⚠️ Skipping unavailable package: $pkg"
          done
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"

      - name: Sync TWRP minimal manifest
        run: |
          mkdir -p ~/twrp && cd ~/twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b "${{ inputs.twrp_branch }}"
          repo sync -c -j"$(nproc --all)" --force-sync --no-clone-bundle --no-tags
          df -h /

      - name: Download device tree
        uses: actions/download-artifact@v5
        with:
          name: device-tree
          path: ${{ runner.temp }}/device

      - name: Build
        run: |
          cd ~/twrp
          cp -r "${{ runner.temp }}/device/." device/
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          CODENAME="${{ needs.generate.outputs.codename }}"
          # Newer sources need a release config in the lunch target
          lunch "twrp_${CODENAME}-eng" || lunch "twrp_${CODENAME}-ap2a-eng"
          mka "${{ needs.generate.outputs.build_target }}"

      - name: Upload image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUT=~/twrp/out/target/product/${{ needs.generate.outputs.codename }}
          if [ "${{ needs.generate.outputs.build_target }}" = "bootimage" ]; then
            IMAGE="$OUT/boot.img"
          else
            IMAGE="$OUT/recovery.img"
          fi
          [ -f "$IMAGE" ] || { echo "❌ Built image not found"; exit 1; }
          NAME="twrp_${{ needs.generate.outputs.codename }}_$(basename "$IMAGE")"
          cp "$IMAGE" "$NAME"
          FILES=("$NAME")
          if [ "${{ needs.generate.outputs.manufacturer }}" = "samsung" ]; then
            # Odin flashable tar
            cp "$IMAGE" "$(basename "$IMAGE")"
            tar -cf "twrp_${{ needs.generate.outputs.codename }}_odin.tar" "$(basename "$IMAGE")"
            FILES+=("twrp_${{ needs.generate.outputs.codename }}_odin.tar")
          fi
          gh release upload "${{ needs.generate.outputs.release_tag }}" "${FILES[@]}" \
            --repo "${{ github.repository }}" --clobber
